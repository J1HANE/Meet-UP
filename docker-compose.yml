networks:
  meet-up:
    driver: bridge

services:
  # MongoDB for Context Service
  mongodb:
    image: mongo:latest
    container_name: meetup-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - meet-up
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Caching
  redis:
    image: redis:latest
    container_name: meetup-redis
    ports:
      - "6379:6379"
    networks:
      - meet-up
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ for Event Bus
  rabbitmq:
    image: rabbitmq:3-management
    container_name: meetup-rabbitmq
    ports:
      - "5672:5672" # AMQP protocol port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - meet-up
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Neo4j for Tweening Service
  neo4j:
    image: neo4j:5
    container_name: meetup-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
    networks:
      - meet-up
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 90s

  # PostgreSQL for Auth Service
  postgres:
    image: postgres:16
    container_name: meetup-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: meetup_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Meeting Service
  postgres-meeting:
    image: postgres:16
    container_name: meetup-postgres-meeting
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: meetup_meeting_service
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: meetup_password
    volumes:
      - postgres_meeting_data:/var/lib/postgresql
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetup"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Task Service
  postgres-task:
    image: postgres:16
    container_name: meetup-postgres-task
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: meetup_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_task_data:/var/lib/postgresql
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: ./meetup-backend/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/meetup_auth
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - JWT_SECRET=defaultSecretKeyForDevelopmentOnly123456789
      - JWT_PRIVATE_KEY_LOCATION=/keys/private.pem
    volumes:
      - jwt_keys:/keys
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  # Context Service
  context-service:
    build:
      context: ./meetup-backend/context-service
      dockerfile: Dockerfile
    container_name: context-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/meetup_context
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - TASK_SERVICE_URL=http://task-service:8091
      - TWEENING_SERVICE_URL=http://tweening-service:8086
      - MEETING_SERVICE_URL=http://meeting-service:8083
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  # Task Service
  task-service:
    build:
      context: ./meetup-backend
      dockerfile: task-service/Dockerfile
    container_name: task-service
    ports:
      - "8091:8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-task:5432/meetup_tasks
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    depends_on:
      postgres-task:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8091/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  # API Gateway
  api-gateway:
    build:
      context: ./meetup-backend/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8085:8085"
    environment:
      - JWT_SECRET=defaultSecretKeyForDevelopmentOnly123456789
      - GATEWAY_JWT_ENABLED=true
      - JWT_PUBLIC_KEY_LOCATION=/keys/public.pem
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - jwt_keys:/keys
    depends_on:
      auth-service:
        condition: service_healthy
      context-service:
        condition: service_healthy
      task-service:
        condition: service_healthy
      meeting-service:
        condition: service_healthy
      tweening-service:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  # Meeting Service
  meeting-service:
    build:
      context: ./meetup-backend/meeting-service
      dockerfile: Dockerfile
    container_name: meeting-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-meeting:5432/meetup_meeting_service
      - SPRING_DATASOURCE_USERNAME=meetup
      - SPRING_DATASOURCE_PASSWORD=meetup_password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - JWT_SECRET=defaultSecretKeyForDevelopmentOnly123456789
    depends_on:
      postgres-meeting:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  # AI Service
  ai-service:
    build:
      context: ./meetup-backend/ai-service
      dockerfile: Dockerfile
    container_name: ai-service
    ports:
      - "8088:8087"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CONTEXT_SERVICE_URL=http://context-service:8084
      - TASK_SERVICE_URL=http://task-service:8091
      - AI_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://localhost:11434
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  # Tweening Service
  tweening-service:
    build:
      context: ./meetup-backend/tweening-service
      dockerfile: Dockerfile
    container_name: tweening-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - meet-up
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

volumes:
  mongodb_data:
  postgres_data:
  postgres_meeting_data:
  postgres_task_data:
  jwt_keys:
  neo4j_data:
  rabbitmq_data:
