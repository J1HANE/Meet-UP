spring.datasource.url=jdbc:h2:mem:meeting_service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

meeting.dev.impersonation=true
meeting.dev.default-user-id=11111111-1111-1111-1111-111111111111
meeting.dev.default-user-name=Meeting Host
