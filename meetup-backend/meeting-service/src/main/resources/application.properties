spring.application.name=meeting-service
server.port=8083

spring.datasource.url=${MEETING_DB_URL:jdbc:postgresql://localhost:5434/meetup_meeting_service}
spring.datasource.username=${MEETING_DB_USERNAME:meetup}
spring.datasource.password=${MEETING_DB_PASSWORD:meetup_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${MEETING_DB_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

meeting.security.require-auth=false

# Dev: act as a user via X-User-Id / X-User-Name (no auth-service)
meeting.dev.impersonation=true
meeting.dev.default-user-id=11111111-1111-1111-1111-111111111111
meeting.dev.default-user-name=Meeting Host

jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnly123456789}

# Stream.io Configuration
# IMPORTANT: Replace these with your actual Stream.io credentials from https://getstream.io/dashboard
# If these are not set, the service will fall back to mock implementations
stream.api-key=${STREAM_API_KEY:bb6vpu4cdecp}
stream.api-secret=${STREAM_API_SECRET:qbxatxrze9un5qkg4kwxb9s55upmw8f3haa9dgtnmnu82py8f5ej8xcjs7vr2bea}
stream.video.default-call-type=default
stream.chat.default-channel-type=messaging

spring.web.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
