services:
  postgres:
    image: postgres:16
    container_name: meetup-meeting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meetup_meeting_service
      POSTGRES_USER: meetup
      POSTGRES_PASSWORD: meetup_password
    ports:
      - "5432:5432"
    volumes:
      - meetup_meeting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetup -d meetup_meeting_service"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meetup_meeting_pgdata:
