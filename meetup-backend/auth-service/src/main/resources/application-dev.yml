spring:
  datasource:
    url: jdbc:h2:mem:meetup_auth;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always
      continue-on-error: true

jwt:
  secret: devSecretKeyForTestingOnly123456789012345678901234567890
  access-token:
    expiration: 3600
  refresh-token:
    expiration: 86400

logging:
  level:
    com.meetup.authservice: DEBUG
    org.springframework.security: DEBUG
