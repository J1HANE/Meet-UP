spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/meetup_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

jwt:
  secret: devSecretKeyForTestingOnly123456789012345678901234567890
  access-token:
    expiration: 3600
  refresh-token:
    expiration: 86400

logging:
  level:
    com.meetup.authservice: DEBUG
    org.springframework.security: DEBUG
