spring.application.name=ai-service
server.port=8087
spring.mvc.async.request-timeout=120000

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.ai.chat.client.enabled=false
spring.ai.ollama.base-url=http://localhost:11434

# Set to whichever model name shows in "ollama list"
# e.g. gemma3:1b  or  qwen2.5:1.5b
spring.ai.ollama.chat.options.model=gemma3:1b
spring.ai.ollama.chat.options.temperature=0.3


spring.ai.google.genai.api-key=${GEMINI_API_KEY:not-set}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash
spring.ai.google.genai.chat.options.temperature=0.3




