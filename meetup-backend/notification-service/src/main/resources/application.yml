spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto      # ack on success, nack on exception
        retry:
          enabled: true
          initial-interval: 2000ms  # wait 2s before first retry
          multiplier: 2             # then 4s, then 8s
          max-retries: 3

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true